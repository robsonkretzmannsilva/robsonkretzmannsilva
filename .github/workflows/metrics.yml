name: Metrics

on:
  schedule:
    - cron: "0 3 * * *" # todo dia, 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Resumo geral: commits, PRs, estrelas, repositórios (inclui privados via METRICS_TOKEN)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: robsonkretzmannsilva
          template: classic
          filename: metrics/overview.svg
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
          config_display: large
          repositories_affiliations: owner
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C

      # Linguagens mais usadas em todos os repositórios
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: robsonkretzmannsilva
          template: classic
          filename: metrics/languages.svg
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 10
